name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 * * * *'   # Runs every hour at minute 0
  workflow_dispatch:       # Allows you to trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        uses: tgymnich/fork-sync@v2.0
        with:
          owner: AliMollayahia      
          base: master                
          head: master               
